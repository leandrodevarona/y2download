<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YouTube free online downloader application" />
    <meta name="robots" content="index, follow" />
    <title>YouTube Downloader</title>
    <link href="{{ url_for('static', path='/styles/home.css') }}" rel="stylesheet" />
    <link rel="icon" href="{{ url_for('static', path='/assets/download_logo.svg') }}" type="image/x-icon" />
</head>

<body>
    <div class="container">
        <section class="download_form__content">
            <h1>Download Video and Audio <span class="blink">Online</span> from YouTube</h1>
            <form onsubmit="show_download_options(event)">
                <div class="search-container">
                    <input type="search" id="Url_Path" name="url" placeholder="Place YouTube link here..."
                        autocomplete="off" required />
                    <button title="Start" type="submit" aria-label="Start" id="btn-submit" class="btn btn-lg">
                        Start
                    </button>
                </div>
                <div class="checkbox-container">
                    <label>Show all available Video formats
                        <input type="checkbox" id="showAllFormats" name="all_videos">
                    </label>
                </div>
            </form>
        </section>

        <section id="download_options" class="download_options">
            <div id="loader" class="loader_container">
                <span class="loader_text">Loading File Info...</span>
                <div class="loader"></div>
            </div>
        </section>
    </div>

    <footer>
        <div class="footer-buttons-container">
            <!-- Like Button -->
            <button class="footer-button" title="I like this" onclick="handleButtonClick(this)">
                <!-- SVG for Like icon (Thumb Up) -->
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#e3e3e3">
                    <path
                        d="M720-120H280v-520l280-280 50 50q7 7 11.5 19t4.5 23v14l-44 174h258q32 0 56 24t24 56v80q0 7-2 15t-4 15L794-168q-9 20-30 34t-44 14Zm-360-80h360l120-280v-80H480l54-220-174 174v406Zm0-406v406-406Zm-80-34v80H160v360h120v80H80v-520h200Z" />
                </svg>
                <span id="likes_value">{{likes}}</span>
            </button>

            <!-- Dislike Button -->
            <button class="footer-button" title="I don't like this" onclick="handleButtonClick(this)">
                <!-- SVG for Dislike icon (Thumb Down - rotated Like icon) -->
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#e3e3e3">
                    <path
                        d="M240-840h440v520L400-40l-50-50q-7-7-11.5-19t-4.5-23v-14l44-174H120q-32 0-56-24t-24-56v-80q0-7 2-15t4-15l120-282q9-20 30-34t44-14Zm360 80H240L120-480v80h360l-54 220 174-174v-406Zm0 406v-406 406Zm80 34v-80h120v-360H680v-80h200v520H680Z" />
                </svg>
                <span id="dislikes_value">{{dislikes}}</span>
            </button>

            <!-- Share Button -->
            <button class="footer-button" title="Share" commandfor="share_dialog" command="show-modal"
                onclick="handleButtonClick(this)">
                <!-- SVG for Share icon -->
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
                    <path
                        d="M680-80q-50 0-85-35t-35-85q0-6 3-28L282-392q-16 15-37 23.5t-45 8.5q-50 0-85-35t-35-85q0-50 35-85t85-35q24 0 45 8.5t37 23.5l281-164q-2-7-2.5-13.5T560-760q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35q-24 0-45-8.5T598-672L317-508q2 7 2.5 13.5t.5 14.5q0 8-.5 14.5T317-452l281 164q16-15 37-23.5t45-8.5q50 0 85 35t35 85q0 50-35 85t-85 35Zm0-80q17 0 28.5-11.5T720-200q0-17-11.5-28.5T680-240q-17 0-28.5 11.5T640-200q0 17 11.5 28.5T680-160ZM200-440q17 0 28.5-11.5T240-480q0-17-11.5-28.5T200-520q-17 0-28.5 11.5T160-480q0 17 11.5 28.5T200-440Zm480-280q17 0 28.5-11.5T720-760q0-17-11.5-28.5T680-800q-17 0-28.5 11.5T640-760q0 17 11.5 28.5T680-720Zm0 520ZM200-480Zm480-280Z" />
                </svg> Share
            </button>
        </div>
    </footer>

    <dialog id="share_dialog">
        <header>
            <button class="close_dialog" commandfor="share_dialog" command="close">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                    fill="#000000">
                    <path
                        d="m291-240-51-51 189-189-189-189 51-51 189 189 189-189 51 51-189 189 189 189-51 51-189-189-189 189Z" />
                </svg>
            </button>
        </header>
        <div>
            <section class="share_social_media">
                <ul class="social_media_list">
                    <li onclick="whatsAppShare()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                            class="bi bi-whatsapp" viewBox="0 0 16 16">
                            <path
                                d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232" />
                        </svg>
                    </li>
                    <li onclick="emailShare()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                            class="bi bi-envelope" viewBox="0 0 16 16">
                            <path
                                d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z" />
                        </svg>
                    </li>
                </ul>
            </section>
            <section class="share_copy_url">
                <div class="copy_url_container">
                    <input id="copy_url_input" type="url" readonly>
                    <button onclick="copyUrl()">Copy</button>
                </div>
            </section>
        </div>
    </dialog>

    <script>
        function showLoader() {
            const loader = document.getElementById('loader')
            loader.style.display = 'flex'
        }

        function hideLoader() {
            const loader = document.getElementById('loader')
            loader.style.display = 'none'
        }

        function show_download_options(event) {
            event.preventDefault();

            const url = event.target.url.value;
            const all_videos = event.target.all_videos.checked;

            const iframe_src = `/download-options?url=${url}&all_videos=${all_videos}`;

            const existing_iframe = document.getElementById('iframe_download_options');

            if (existing_iframe) {
                existing_iframe.remove();
            }

            // 1. Crear el iframe  
            const iframe = document.createElement('iframe');
            const btnSubmit = document.getElementById('btn-submit');

            // 2. Configurar atributos 
            iframe.src = iframe_src; // Cambia esta URL por la que necesites  
            iframe.id = 'iframe_download_options'
            iframe.frameBorder = '0';
            iframe.style.display = 'none'
            iframe.style.overflowY = 'auto'
            iframe.onload = () => {
                btnSubmit.disabled = false;

                hideLoader();

                iframe.width = '100%';
                iframe.height = '300';
                iframe.style.display = 'block'

            }

            // 3. Seleccionar el elemento padre 
            const elementoPadre = document.getElementById('download_options'); // Cambia 'miElemento' por el ID del elemento deseado  
            elementoPadre.style.display = 'flex'

            // 4. Agregar el iframe al elemento padre  
            elementoPadre.appendChild(iframe);

            btnSubmit.disabled = true;

            showLoader();
        }

        function whatsAppShare() {
            const url = window.location.href;
            const urlWhatsApp = "https://wa.me/?text=" + url;
            window.open(urlWhatsApp, '_blank');
        }

        function emailShare() {
            const url = window.location.href;
            let mailtoLink = `mailto:?subject=y2Download&body=Open: ${url}`;
            window.open(mailtoLink, '_blank');
        }

        (function () {
            const url = window.location.href;
            const copyUrlInput = document.getElementById("copy_url_input");
            copyUrlInput.value = url;
        })();

        async function copyUrl() {
            const url = window.location.href;
            try {
                await navigator.clipboard.writeText(url);
                alert("Url copy to clipboard.");
            } catch (error) {
                alert("Clipboard copy error.");
            }
        }

        // Placeholder functions for the original button logic
        async function like() {
            try {
                const response = await fetch("/metadata/like", {
                    method: "PUT"
                });

                const data = await response.json();

                const likes = data.likes;

                const likesSpan = document.getElementById("likes_value");
                likesSpan.innerText = likes;

            } catch (error) {

                console.error(error);

            }
            console.log("Like button clicked!");
        }

        async function dislike() {
            try {
                const response = await fetch("/metadata/dislike", {
                    method: "PUT"
                });

                const data = await response.json();

                const dislikes = data.dislikes;

                const dislikesSpan = document.getElementById("dislikes_value");
                dislikesSpan.innerText = dislikes;

            } catch (error) {

                console.error(error);

            }
            console.log("Dislike button clicked!");
        }

        // Main function to handle the animation and reset
        function handleButtonClick(buttonElement) {
            // Find the SVG inside the clicked button
            const clickedSvg = buttonElement.querySelector('svg');

            // Apply the "enlarged-svg" class to start the transition
            clickedSvg.classList.add('enlarged-svg');

            // Find all SVGs to reset them later
            const allSvgs = document.querySelectorAll('.footer-button svg');

            // Use setTimeout to remove the class from all SVGs after a delay
            setTimeout(() => {
                allSvgs.forEach(svg => {
                    svg.classList.remove('enlarged-svg');
                });
            }, 600); // The delay is 600ms, which is slightly longer than the 300ms transition
        }
    </script>
</body>

</html>
