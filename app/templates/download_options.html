<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Video and Audio from YouTube</title>
    <link href="{{ url_for('static', path='/styles/download_options.css') }}" rel="stylesheet" />
    <link rel="icon" href="{{ url_for('static', path='/assets/download_logo.svg') }}" type="image/x-icon" />
</head>

<body>
    <main>
        <progress id="progressInput" max="100" value="0" hidden></progress>
        <div class="container">
            <section>
                <img class="container_img" src="{{thumbnail}}" alt="Video preview">
                <span>{{fullname}}</span>
            </section>
            <section>
                <div class="tabs">
                    <div class="tab active" onclick="showTab('videoTab')">Video</div>
                    <div class="tab" onclick="showTab('audioTab')">Audio</div>
                </div>

                <!-- Video options -->
                <div id="videoTab" class="tabContent">
                    <table class="options_table">
                        {% for option in video_options %}
                        <tr>
                            <th>{{option.name}}</th>
                            <th>{{option.size}}</th>
                            <th>
                                <button id="{{option.name}}"
                                    onclick="initDownload('{{ option.url }}', '{{ option.name }}')">
                                    <span id="span_{{option.name}}">Descargar</span>
                                    <div id="loader_{{option.name}}" class="dots_loader" hidden></div>
                                </button>
                            </th>
                        </tr>
                        {% endfor %}
                    </table>
                </div>

                <!-- Audio options -->
                <div id="audioTab" class="tabContent hidden">
                    <table class="options_table">
                        {% for audio_option in audio_options %}
                        <tr>
                            <th>{{audio_option.name}}</th>
                            <th>{{audio_option.size}}</th>
                            <th>
                                <button id="{{audio_option.name}}"
                                    onclick="initDownload('{{ audio_option.url }}', '{{ audio_option.name }}')">
                                    <span id="span_{{audio_option.name}}">Descargar</span>
                                    <div id="loader_{{audio_option.name}}" class="dots_loader" hidden></div>
                                </button>
                            </th>
                        </tr>
                        {% endfor %}
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Placeholder for Python function -->
    <script>
        function analyze(url) {
            window.location.href = `/download?url=${url}`
        }

        function showTab(tabName) {
            const videoTab = document.getElementById('videoTab');
            const audioTab = document.getElementById('audioTab');
            const tabs = document.querySelectorAll('.tab');

            if (tabName === 'videoTab') {
                videoTab.classList.remove('hidden');
                audioTab.classList.add('hidden');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                audioTab.classList.remove('hidden');
                videoTab.classList.add('hidden');
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
            }
        }

        function showLoader(name) {

            const button = document.getElementById(name);
            const span = document.getElementById(`span_${name}`);
            const loader = document.getElementById(`loader_${name}`)

            button.disabled = true;
            span.hidden = true;
            loader.hidden = false;

        }

        function showProgress(value) {

            const progressInput = document.getElementById('progressInput');
            progressInput.hidden = false;
            progressInput.value = value;

        }

        function hiddenProgress() {

            const progressInput = document.getElementById('progressInput');
            progressInput.hidden = true;

        }

        function hiddenLoader(name) {

            const button = document.getElementById(name);
            const span = document.getElementById(`span_${name}`);
            const loader = document.getElementById(`loader_${name}`)

            button.disabled = false;
            span.hidden = false;
            loader.hidden = true;

        }

        async function initDownload(url, name) {

            showLoader(name);

            try {
                const source = new EventSource("http://127.0.0.1:8000/get-progress");

                source.addEventListener('progressUpdate', function (event) {
                    const progress = JSON.parse(event.data);
                    console.log('ProgressUpdate', progress);
                    showProgress(progress);

                    // if(progress == 100) {
                    //     source.close();
                    // }
                });

                let response = await fetch(url);

                if (!response.ok) throw new Error('Error en la red');

                const data = (await response.json());

                const domain = window.location.origin;

                const file_path = domain + '/' + data.file_path;

                const link = document.createElement('a');
                link.href = file_path;
                link.download = '';
                link.click();

                hiddenLoader(name);

                setTimeout(async () => {
                    await fetch(`/delete-file?file_path=${data.file_path}`, { method: 'DELETE' });
                }, 500)

            } catch (error) {
                console.error('There was a problem downloading: ', error);
            }
        }

    </script>
</body>
